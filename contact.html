    <!--
      Contact-Section: form skeleton, ready to wire up.
      TODO before launch:
        1. Create a free Formspree (or similar) account and get a form endpoint.
        2. Replace the action="TODO-FORM-ENDPOINT" below with it.
        3. Formspree handles spam filtering server-side; the honeypot field
           below is a free extra layer that works without any service.
    -->
    <section class="section" style="max-width:560px;margin-inline:auto;">
      <form action="https://TODO-FORM-ENDPOINT" method="POST" novalidate>
        <div class="form-field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required minlength="2" placeholder=" ">
        </div>
        <div class="form-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required placeholder=" ">
        </div>
        <div class="form-field">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" required minlength="10" placeholder=" "></textarea>
        </div>
        <!-- honeypot: real visitors never fill this in; bots usually do -->
        <div class="hp-field" aria-hidden="true">
          <label for="company">Company</label>
          <input type="text" id="company" name="company" tabindex="-1" autocomplete="off">
        </div>
        <button type="submit">Send</button>
      </form>
    </section>
